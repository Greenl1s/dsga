<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление оборудованием - Админка</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Управление оборудованием</h1>
            <div class="header-buttons">
                <button class="btn btn-success" onclick="addItem()">➕ Добавить прибор</button>
                <button class="btn btn-primary" onclick="exportToCSV()">📥 Экспорт CSV</button>
                <button class="btn btn-warning" onclick="loadData()">🔄 Обновить</button>
            </div>
        </div>
        
        <div class="filters">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Поиск по названию, серийному номеру, модели..." onkeyup="renderTable()">
            </div>
            <div class="filter-group">
                <select id="docFilter" onchange="renderTable()">
                    <option value="">Все типы документов</option>
                    <option value="Поверка">Поверка</option>
                    <option value="Калибровка">Калибровка</option>
                </select>
                <select id="statusFilter" onchange="renderTable()">
                    <option value="">Все статусы</option>
                    <option value="valid">Действительные</option>
                    <option value="expired">Просроченные</option>
                </select>
            </div>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('id')">ID</th>
                        <th onclick="sortTable('name')">Наименование</th>
                        <th onclick="sortTable('serial_number')">Серийный номер</th>
                        <th onclick="sortTable('model')">Модель</th>
                        <th onclick="sortTable('doc_type')">Тип</th>
                        <th onclick="sortTable('verification_date')">Дата поверки</th>
                        <th onclick="sortTable('valid_until')">Действителен до</th>
                        <th>Статус</th>
                        <th>QR-код</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="10">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Модальное окно редактирования -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Добавить/Редактировать прибор</h2>
            <input type="text" id="itemName" placeholder="Наименование прибора *" required>
            <input type="text" id="itemSerial" placeholder="Серийный номер">
            <input type="text" id="itemModel" placeholder="Модель">
            <select id="itemDocType">
                <option value="Поверка">Поверка</option>
                <option value="Калибровка">Калибровка</option>
            </select>
            <input type="date" id="itemVerifDate" placeholder="Дата поверки">
            <input type="date" id="itemValidUntil" placeholder="Действителен до (оставьте пустым для бессрочного)">
            <input type="url" id="itemDocLink" placeholder="Ссылка на документ (Яндекс.Диск)">
            <textarea id="itemInfo" placeholder="Дополнительная информация"></textarea>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="saveItem()">💾 Сохранить</button>
                <button class="btn btn-danger" onclick="closeModal()">❌ Отмена</button>
            </div>
        </div>
    </div>
    
    <script src="admin.js"></script>
</body>
</html>
